name: Deploy MFE to AWS

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  NODE_VERSION: '20'
  AWS_REGION: 'us-east-1'

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || (github.ref_name == 'main' && 'prod' || 'staging') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set environment
        id: env
        run: |
          if [[ "${{ github.event.inputs.environment }}" != "" ]]; then
            echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "ENVIRONMENT=prod" >> $GITHUB_OUTPUT
          else
            echo "ENVIRONMENT=staging" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.1  # Updated version with new GPG keys

      # Get existing CloudFront URLs without running terraform apply
      - name: Get existing infrastructure outputs
        id: infra
        run: |
          cd terraform
          terraform init -input=false

          # Only refresh state, don't apply changes
          terraform refresh -input=false

          # Get outputs
          echo "HOST_URL=$(terraform output -raw host_app_url)" >> $GITHUB_OUTPUT
          echo "HOST_BUCKET=$(terraform output -raw host_s3_bucket_name)" >> $GITHUB_OUTPUT
          terraform output -json federation_manifest > /tmp/federation-manifest.json
          terraform output -json remote_s3_bucket_names > /tmp/remote-buckets.json
        env:
          TF_DISABLE_SIGNATURE_VERIFICATION: '1'z

      # Rest of your workflow continues...
      - name: Generate production federation manifest
        run: |
          mkdir -p projects/host-app/src/assets
          cp /tmp/federation-manifest.json projects/host-app/src/assets/federation.manifest.json
          cat projects/host-app/src/assets/federation.manifest.json | jq '.'

      - name: Build Angular applications
        run: |
          if npx ng build shared-utils --configuration=production 2>/dev/null; then
            echo "✅ shared-utils built"
          fi
          npx ng build host-app --configuration=production
          for app in app-list app-workspace actor-app app-edit home-app app-parser; do
            npx ng build "$app" --configuration=production
          done

      - name: Deploy to S3
        run: |
          aws s3 sync "dist/host-app/browser/" "s3://${{ steps.terraform.outputs.HOST_BUCKET }}/" --delete
          cat /tmp/remote-buckets.json | jq -r 'to_entries[] | "\(.key) \(.value)"' | while read app bucket; do
            if [ -d "dist/${app}/browser" ]; then
              aws s3 sync "dist/${app}/browser/" "s3://${bucket}/" --delete
            fi
          done

      - name: Output deployment URLs
        run: |
          echo "=========================================="
          echo "✅ Deployment Complete!"
          echo "=========================================="
          echo "Host URL: ${{ steps.terraform.outputs.HOST_URL }}"
          echo "=========================================="
