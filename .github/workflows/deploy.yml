name: Deploy MFE Code Updates

on:
  push:
    branches:
      - main
      - staging
    paths-ignore:
      - 'terraform/**'
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  NODE_VERSION: '20'
  AWS_REGION: 'us-east-1'
  REMOTE_APPS: 'app-list app-workspace actor-app app-edit home-app app-parser app-models'

concurrency:
  group: deploy-mfe
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || (github.ref_name == 'main' && 'prod' || 'staging') }}
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.1

      # Reads from the S3 remote backend configured in terraform_clean/main.tf
      - name: Get infrastructure outputs
        id: infra
        run: |
          cd terraform_clean
          terraform init -input=false

          echo "host_url=$(terraform output -raw host_app_url)" >> "$GITHUB_OUTPUT"
          echo "host_bucket=$(terraform output -raw host_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "host_distribution_id=$(terraform output -raw host_distribution_id)" >> "$GITHUB_OUTPUT"

          terraform output -json remote_app_urls > /tmp/remote_app_urls.json
          terraform output -json remote_bucket_names > /tmp/remote_bucket_names.json
          terraform output -json remote_distribution_ids > /tmp/remote_distribution_ids.json

      # Generate federation manifest with CloudFront URLs
      - name: Generate federation manifest
        run: |
          mkdir -p projects/host-app/public

          jq 'with_entries(.value += "/remoteEntry.json")' /tmp/remote_app_urls.json \
            > projects/host-app/public/federation.manifest.json

          echo "✅ Federation manifest generated:"
          cat projects/host-app/public/federation.manifest.json | jq '.'

      # Build ALL Angular applications
      - name: Build Angular applications
        run: |
          if npx ng build shared-utils --configuration=production 2>/dev/null; then
            echo "✅ shared-utils built"
          fi

          echo "Building host-app..."
          npx ng build host-app --configuration=production
          echo "✅ host-app built"

          echo "Building remote apps..."
          for app in $REMOTE_APPS; do
            echo "  Building $app..."
            npx ng build "$app" --configuration=production
            echo "  ✅ $app built"
          done

      # Deploy to S3
      - name: Deploy to S3
        run: |
          echo "Deploying host-app to s3://${{ steps.infra.outputs.host_bucket }}"
          aws s3 sync "dist/host-app/browser/" "s3://${{ steps.infra.outputs.host_bucket }}/" --delete
          echo "✅ host-app deployed to S3"

          echo "Deploying remote apps to S3..."
          for app in $REMOTE_APPS; do
            BUCKET=$(jq -r ".\"${app}\"" /tmp/remote_bucket_names.json)
            if [ -n "$BUCKET" ] && [ "$BUCKET" != "null" ] && [ -d "dist/${app}/browser" ]; then
              echo "  Deploying $app to s3://$BUCKET"
              aws s3 sync "dist/${app}/browser/" "s3://${BUCKET}/" --delete
              echo "  ✅ $app deployed to S3"
            else
              echo "  ⚠️ Skipping $app - bucket not found or dist missing"
            fi
          done

      # S3 sometimes serves .js/.mjs with the wrong Content-Type, which breaks module loading
      - name: Fix JS Content-Type headers
        run: |
          fix_bucket() {
            echo "  Fixing Content-Type for s3://$1"
            aws s3 cp "s3://$1/" "s3://$1/" \
              --recursive \
              --exclude "*" \
              --include "*.js" \
              --include "*.mjs" \
              --content-type "application/javascript" \
              --metadata-directive REPLACE
          }

          fix_bucket "${{ steps.infra.outputs.host_bucket }}"

          for app in $REMOTE_APPS; do
            BUCKET=$(jq -r ".\"${app}\"" /tmp/remote_bucket_names.json)
            if [ -n "$BUCKET" ] && [ "$BUCKET" != "null" ]; then
              fix_bucket "$BUCKET"
            fi
          done
          echo "✅ Content-Type fix complete"

      # Invalidate CloudFront cache
      - name: Invalidate CloudFront cache
        run: |
          echo "Invalidating host CloudFront: ${{ steps.infra.outputs.host_distribution_id }}"
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.infra.outputs.host_distribution_id }}" \
            --paths "/*"
          echo "✅ Host cache invalidation requested"

          echo "Invalidating remote CloudFront distributions..."
          for app in $REMOTE_APPS; do
            DIST_ID=$(jq -r ".\"${app}\"" /tmp/remote_distribution_ids.json)
            if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "null" ]; then
              echo "  Invalidating $app (ID: $DIST_ID)"
              aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
              echo "  ✅ $app cache invalidation requested"
            else
              echo "  ⚠️ Skipping invalidation for $app - distribution ID not found"
            fi
          done

      - name: Wait for cache invalidation
        run: |
          echo "Waiting 30 seconds for cache invalidation to start..."
          sleep 30

      # Output deployment URLs
      - name: Output deployment URLs
        run: |
          echo "========================================="
          echo "✅ DEPLOYMENT COMPLETE!"
          echo "========================================="
          echo ""
          echo "📍 HOST APP URL (CloudFront):"
          echo "   ${{ steps.infra.outputs.host_url }}"
          echo ""
          echo "📦 REMOTE APP URLs (CloudFront):"
          jq -r 'to_entries[] | "   \(.key): \(.value)"' /tmp/remote_app_urls.json
          echo ""
          echo "📋 FEDERATION MANIFEST:"
          echo "   ${{ steps.infra.outputs.host_url }}/federation.manifest.json"
          echo ""
          echo "⚠️  Note: CloudFront cache invalidation takes 2-5 minutes to fully propagate"
          echo "========================================="

  # Smoke test job
  smoke-test:
    name: Smoke Test
    needs: deploy
    runs-on: ubuntu-latest
    if: success() && github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.1

      - name: Get host URL
        id: urls
        run: |
          cd terraform_clean
          terraform init -input=false
          echo "host_url=$(terraform output -raw host_app_url)" >> "$GITHUB_OUTPUT"

      - name: Test host app
        run: |
          echo "Testing host app: ${{ steps.urls.outputs.host_url }}"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.urls.outputs.host_url }}" --max-time 30)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Host app returned HTTP $HTTP_CODE"
            exit 1
          fi
          echo "✅ Host app is accessible"

      - name: Test federation manifest
        run: |
          MANIFEST_URL="${{ steps.urls.outputs.host_url }}/federation.manifest.json"
          echo "Testing manifest: $MANIFEST_URL"

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$MANIFEST_URL" --max-time 30)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "⚠️  Federation manifest returned HTTP $HTTP_CODE"
          else
            echo "✅ Federation manifest accessible"
            curl -s "$MANIFEST_URL" | jq '.'
          fi
