name: Deploy MFE to AWS

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  NODE_VERSION: '20'
  AWS_REGION: 'us-east-1'

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || (github.ref_name == 'main' && 'prod' || 'staging') }}
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Determine environment
      - name: Set environment
        id: env
        run: |
          if [[ "${{ github.event.inputs.environment }}" != "" ]]; then
            echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "ENVIRONMENT=prod" >> $GITHUB_OUTPUT
          else
            echo "ENVIRONMENT=staging" >> $GITHUB_OUTPUT
          fi

      - name: Debug AWS Secrets (Safe Check)
        run: |
          echo "=========================================="
          echo "🔍 Checking AWS Secrets Configuration"
          echo "=========================================="

          # Check if secrets exist (without exposing full values)
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            AWS_KEY_LENGTH=$(echo -n "${{ secrets.AWS_ACCESS_KEY_ID }}" | wc -c)
            AWS_KEY_PREFIX=$(echo -n "${{ secrets.AWS_ACCESS_KEY_ID }}" | cut -c1-4)
            echo "✅ AWS_ACCESS_KEY_ID is set (Length: $AWS_KEY_LENGTH chars, Prefix: ${AWS_KEY_PREFIX}***)"
          else
            echo "❌ AWS_ACCESS_KEY_ID is NOT set"
            exit 1
          fi

          if [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            AWS_SECRET_LENGTH=$(echo -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" | wc -c)
            echo "✅ AWS_SECRET_ACCESS_KEY is set (Length: $AWS_SECRET_LENGTH chars)"
          else
            echo "❌ AWS_SECRET_ACCESS_KEY is NOT set"
            exit 1
          fi

          if [ -n "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "✅ AWS_ROLE_ARN is set: ${{ secrets.AWS_ROLE_ARN }}"
          else
            echo "⚠️  AWS_ROLE_ARN is not set (not needed for access keys method)"
          fi

          echo ""
          echo "Expected formats:"
          echo "  - AWS_ACCESS_KEY_ID: Should start with 'AKIA' and be 20 characters"
          echo "  - AWS_SECRET_ACCESS_KEY: Should be 40 characters"
          echo ""

          # Validate key formats
          if [[ "${{ secrets.AWS_ACCESS_KEY_ID }}" =~ ^AKIA[0-9A-Z]{16}$ ]]; then
            echo "✅ AWS_ACCESS_KEY_ID format looks correct"
          else
            echo "⚠️  AWS_ACCESS_KEY_ID format may be incorrect. Should start with 'AKIA' and be 20 characters total"
          fi

          if [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            AWS_SECRET_LEN=$(echo -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" | wc -c)
            if [ $AWS_SECRET_LEN -eq 40 ]; then
              echo "✅ AWS_SECRET_ACCESS_KEY length looks correct (40 chars)"
            else
              echo "⚠️  AWS_SECRET_ACCESS_KEY length is $AWS_SECRET_LEN chars, expected 40 chars"
            fi
          fi

      # Configure AWS credentials with Access Keys (simpler)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      # Terraform Init
      - name: Terraform Init
        run: |
          cd terraform
          terraform init
        env:
          TF_VAR_environment: ${{ steps.env.outputs.ENVIRONMENT }}

      # Terraform Apply
      - name: Terraform Apply
        id: terraform
        run: |
          cd terraform
          terraform apply -auto-approve \
            -var="environment=${{ steps.env.outputs.ENVIRONMENT }}"

          # Save outputs for later steps
          echo "HOST_URL=$(terraform output -raw host_app_url)" >> $GITHUB_OUTPUT
          echo "HOST_BUCKET=$(terraform output -raw host_s3_bucket_name)" >> $GITHUB_OUTPUT
          terraform output -json federation_manifest > /tmp/federation-manifest.json
          terraform output -json remote_s3_bucket_names > /tmp/remote-buckets.json
        env:
          TF_VAR_environment: ${{ steps.env.outputs.ENVIRONMENT }}

      # Generate production federation manifest
      - name: Generate production federation manifest
        run: |
          echo "📝 Generating production federation manifest..."

          # Create assets directory if it doesn't exist
          mkdir -p projects/host-app/src/assets

          # Copy the Terraform-generated manifest to the Angular project
          cp /tmp/federation-manifest.json projects/host-app/src/assets/federation.manifest.json

          echo "✅ Federation manifest generated:"
          cat projects/host-app/src/assets/federation.manifest.json | jq '.'

      # Build Angular applications
      - name: Build Angular applications
        run: |
          # Build shared-utils if exists
          if npx ng build shared-utils --configuration=production 2>/dev/null; then
            echo "✅ shared-utils built"
          fi

          # Build host app
          echo "Building host-app..."
          npx ng build host-app --configuration=production

          # Build remote apps
          echo "Building remote apps..."
          for app in app-list app-workspace actor-app app-edit home-app app-parser; do
            echo "  Building $app..."
            npx ng build "$app" --configuration=production
          done

      # Verify manifest was included in build
      - name: Verify manifest in build output
        run: |
          echo "🔍 Verifying manifest was included in build..."

          if [ -f "dist/host-app/browser/assets/federation.manifest.json" ]; then
            echo "✅ Manifest found in build output"
            cat dist/host-app/browser/assets/federation.manifest.json | jq '.'
          else
            echo "⚠️  Manifest not found in build output, copying it..."
            mkdir -p dist/host-app/browser/assets
            cp /tmp/federation-manifest.json dist/host-app/browser/assets/federation.manifest.json
          fi

      # Deploy to S3
      - name: Deploy to S3
        run: |
          echo "📤 Deploying to S3..."

          # Deploy host app
          echo "Deploying host app to ${{ steps.terraform.outputs.HOST_BUCKET }}..."
          aws s3 sync "dist/host-app/browser/" "s3://${{ steps.terraform.outputs.HOST_BUCKET }}/" --delete

          # Deploy remote apps
          echo "Deploying remote apps..."
          cat /tmp/remote-buckets.json | jq -r 'to_entries[] | "\(.key) \(.value)"' | while read app bucket; do
            if [ -d "dist/${app}/browser" ]; then
              echo "  Deploying $app to $bucket..."
              aws s3 sync "dist/${app}/browser/" "s3://${bucket}/" --delete
            fi
          done

          echo "✅ Deployment to S3 complete"

      # Invalidate CloudFront cache
      - name: Invalidate CloudFront cache
        run: |
          echo "🔄 Invalidating CloudFront cache..."

          cd terraform
          CF_IDS=$(terraform output -json cloudfront_distribution_ids 2>/dev/null || echo "{}")

          # Invalidate host distribution
          HOST_CF_ID=$(echo "$CF_IDS" | jq -r '.host')
          if [ -n "$HOST_CF_ID" ] && [ "$HOST_CF_ID" != "null" ]; then
            echo "Invalidating host CloudFront: $HOST_CF_ID"
            aws cloudfront create-invalidation --distribution-id "$HOST_CF_ID" --paths "/*" --no-cli-pager || true
          fi

          # Invalidate remote distributions
          echo "$CF_IDS" | jq -r '.remote | to_entries[] | .value' | while read cf_id; do
            if [ -n "$cf_id" ] && [ "$cf_id" != "null" ]; then
              echo "Invalidating remote CloudFront: $cf_id"
              aws cloudfront create-invalidation --distribution-id "$cf_id" --paths "/*" --no-cli-pager || true
            fi
          done

          cd ..

      # Output deployment URLs
      - name: Output deployment URLs
        run: |
          echo "=========================================="
          echo "✅ Deployment Complete!"
          echo "=========================================="
          echo "Host URL: ${{ steps.terraform.outputs.HOST_URL }}"
          echo ""
          echo "Federation Manifest:"
          cat /tmp/federation-manifest.json | jq '.'
          echo ""
          echo "To view your app: ${{ steps.terraform.outputs.HOST_URL }}"
          echo "=========================================="
