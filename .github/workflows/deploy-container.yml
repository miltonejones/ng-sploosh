name: Build & Deploy to Production Container

on:
  push:
    branches: [deploy-prod]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Print env info
        run: |
          node --version
          npm --version
          npx ng version

      - name: Build host-app (debug)
        continue-on-error: true
        run: npx ng build host-app --configuration=production --verbose 2>&1 | tail -50

      - name: Check dist after host build
        run: |
          echo "=== Checking dist ==="
          find dist -type f 2>/dev/null | head -20 || echo "NO FILES"
          ls -la dist/host-app/browser/ 2>/dev/null || echo "NO HOST DIST"
