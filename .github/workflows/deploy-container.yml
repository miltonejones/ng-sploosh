name: Build & Deploy to Production Container

# Full pipeline: push to deploy-prod → build Angular apps → push container-prod branch → deploy to nginx container
on:
  push:
    branches: [deploy-prod]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build shared-utils
        run: npx ng build shared-utils --configuration=production 2>/dev/null || true

      - name: Build host-app
        run: npx ng build host-app --configuration=production

      - name: Build remote apps
        run: |
          for app in app-list app-workspace actor-app app-edit home-app app-parser app-models; do
            npx ng build "$app" --configuration=production
          done

      - name: Verify builds produced output
        run: |
          missing=""
          [ -f dist/host-app/browser/index.html ] || missing="$missing host-app"
          for app in app-list app-workspace actor-app app-edit home-app app-parser app-models; do
            [ -f "dist/$app/browser/remoteEntry.json" ] || missing="$missing $app"
          done
          if [ -n "$missing" ]; then
            echo "ERROR: missing dist for:$missing"
            find dist -type f 2>/dev/null | head -50
            exit 1
          fi
          echo "All builds verified"

      - name: Fix federation manifest
        run: node build-scripts/prepare-federation.js

      - name: Assemble production directory
        run: |
          shopt -s nullglob
          rm -rf prod-dist
          mkdir -p prod-dist
          cp dist/host-app/browser/* prod-dist/
          for app in app-list app-workspace actor-app app-edit home-app app-parser app-models; do
            mkdir -p "prod-dist/$app"
            cp -r "dist/$app/browser/"* "prod-dist/$app/"
            echo "Copied $app"
          done

      - name: Deploy to container-prod branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./prod-dist
          publish_branch: container-prod
          force_orphan: true
          commit_message: 'deploy: container production build [skip ci]'

      - name: Deploy to production container
        run: |
          curl -X POST https://dockyard-ai.com/api/github/pull-to-container \
            -H "Content-Type: application/json" \
            -d '{"owner":"miltonejones","repo":"ng-sploosh","ref":"container-prod","id":"ng-sploosh-prod","path":"/usr/share/nginx/html"}' \
            --max-time 60 \
            --fail-with-body
