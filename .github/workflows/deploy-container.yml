name: Build & Deploy to Production Container

on:
  push:
    branches: [deploy-prod]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build all apps
        run: |
          npx ng build host-app --configuration=production || true
          for app in app-list app-workspace actor-app app-edit home-app app-parser app-models; do
            npx ng build "$app" --configuration=production || true
          done

      - name: Fix federation manifest
        run: |
          node build-scripts/prepare-federation.js

      - name: Assemble production directory
        run: |
          rm -rf prod-dist
          mkdir -p prod-dist
          cp dist/host-app/browser/* prod-dist/
          for app in app-list app-workspace actor-app app-edit home-app app-parser app-models; do
            mkdir -p "prod-dist/$app"
            cp -r "dist/$app/browser/"* "prod-dist/$app/"
          done

      - name: Deploy to container-prod branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./prod-dist
          publish_branch: container-prod
          force_orphan: true
          commit_message: 'deploy: container production build [skip ci]'
