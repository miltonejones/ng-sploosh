name: Build & Deploy to Production Container

# Trigger: push to deploy-prod branch only — isolated from main/master workflows
on:
  push:
    branches: [deploy-prod]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build host-app
        run: npx ng build host-app --configuration=production 2>&1 || { ec=$?; echo "Build exited with $ec (esbuild shutdown deadlock is non-fatal)"; }

      - name: Build remote apps
        run: |
          for app in app-list app-workspace actor-app app-edit home-app app-parser app-models; do
            npx ng build "$app" --configuration=production 2>&1 || { ec=$?; echo "Build exited with $ec (esbuild shutdown deadlock is non-fatal)"; }
          done

      - name: Verify output exists
        run: |
          echo "Host app files:"
          ls dist/host-app/browser/ | head -20
          for app in app-list app-workspace actor-app app-edit home-app app-parser app-models; do
            echo "--- $app ---"
            ls "dist/$app/browser/" 2>/dev/null | head -5 || echo "  MISSING"
          done

      - name: Fix federation manifest
        run: |
          echo '{"app-list":"./app-list/remoteEntry.json","app-workspace":"./app-workspace/remoteEntry.json","actor-app":"./actor-app/remoteEntry.json","app-edit":"./app-edit/remoteEntry.json","home-app":"./home-app/remoteEntry.json","app-parser":"./app-parser/remoteEntry.json","app-models":"./app-models/remoteEntry.json"}' > dist/host-app/browser/federation.manifest.json
          cat dist/host-app/browser/federation.manifest.json

      - name: Assemble production directory
        run: |
          rm -rf prod-dist
          mkdir -p prod-dist
          cp dist/host-app/browser/* prod-dist/
          for app in app-list app-workspace actor-app app-edit home-app app-parser app-models; do
            mkdir -p "prod-dist/$app"
            cp -r "dist/$app/browser/"* "prod-dist/$app/"
          done

      - name: Deploy to container-prod branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./prod-dist
          publish_branch: container-prod
          force_orphan: true
          commit_message: 'deploy: container production build [skip ci]'
