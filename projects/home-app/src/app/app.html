<app-home-grid
  label="Recently Watched"
  [videos]="recents()"
  emptyMessage="No recently watched videos yet"
  (videoSelect)="launchVideo($event)"
  (modelSelect)="selectModelById($event)"
></app-home-grid>

<div class="d-flex justify-content-between align-items-center banner">
  <b>Top Models</b>
  <button class="btn btn-sm" (click)="expand('models')">
    {{ expanded().models ? 'Show less' : 'View all' }}
  </button>
</div>

@if (models().length) {
  <div class="model-grid">
    @for(star of models(); track star.ID) {
      <app-model-card [model]="star" (select)="selectModel($event)"></app-model-card>
    }
  </div>
  @if (expanded().models) {
    <div class="model-grid">
      @for(star of remaining(); track star.ID) {
        <app-model-card [model]="star" (select)="selectModel($event)"></app-model-card>
      }
    </div>
  }
} @else {
  <div class="model-grid">
    @for(i of [1,2,3,4,5,6]; track i) {
      <div class="skeleton skeleton-card"></div>
    }
  </div>
}

<app-home-grid
  label="Favorites"
  [videos]="favorites()"
  emptyMessage="No favorites yet — click the heart on a video to add it here"
  (videoSelect)="launchVideo($event)"
  (modelSelect)="selectModelById($event)"
></app-home-grid>

<app-home-grid
  label="Latest Added"
  [videos]="latest()"
  emptyMessage="No videos available"
  (videoSelect)="launchVideo($event)"
  (modelSelect)="selectModelById($event)"
></app-home-grid>
