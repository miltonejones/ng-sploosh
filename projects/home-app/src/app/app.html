<app-home-grid
  label="Recently Watched"
  [videos]="recents()"
  (videoSelect)="launchVideo($event)"
  (modelSelect)="selectModelById($event)"
></app-home-grid>

<div class="d-flex justify-content-between align-items-center banner">
  <b>Top Models</b>
  <button class="btn btn-sm" (click)="expand('models')">View all</button>
</div>
<div class="model-grid">
  @for(star of models();track star.ID) {
  <app-model-card [model]="star" (select)="selectModel($event)"></app-model-card>
  } @if(expanded().models) { @for(star of remaining();track star.ID) {
  <app-model-card [model]="star" (select)="selectModel($event)"></app-model-card>
  } }
</div>
