@if (videos().length) {
  <div class="d-flex justify-content-between align-items-center banner">
    <b>{{ label() }}</b>
    <button class="btn btn-sm" (click)="expand()">
      {{ expanded() ? 'Show less' : 'View all' }}
    </button>
  </div>

  <div class="film-grid">
    @for(film of first(); track film.ID) {
      <lib-track-card
        [track]="film"
        (modelSelect)="selectModelById($event)"
        (regionSelect)="openVideo($event, film)"
      ></lib-track-card>
    }
  </div>

  <div class="expand-container" [class.open]="expanded()">
    @for(film of remaining(); track film.ID) {
      <lib-track-card
        [track]="film"
        (modelSelect)="selectModelById($event)"
        (regionSelect)="openVideo($event, film)"
      ></lib-track-card>
    }
  </div>
} @else {
  <div class="empty-state">
    <i class="fa-solid fa-film"></i>
    {{ emptyMessage() }}
  </div>
}
