<!-- Modal -->
<!-- -->
<div
  class="modal fade"
  id="globalModal"
  tabindex="-1"
  aria-labelledby="globalModalLabel"
  aria-hidden="true"
  data-bs-backdrop="static"
  data-bs-keyboard="false"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">{{ request()?.title || request()?.type }}</div>
      <div class="modal-body">
        <div class="d-flex gap-1 align-items-start">
          @if (request()?.image) {
          <div class="message-photo" [libImageSource]="request()?.image"></div>
          }
          <div class="message-text">
            @if(request()?.type === "prompt") {
            <input
              #inputField
              class="form-control form-control-sm"
              [placeholder]="request()?.message"
              [(ngModel)]="responseText"
              (keydown.enter)="handleEnter()"
              [class.fullwidth]="!request()?.image"
            />

            <table>
              @for (url of responseStrings(); track $index) {
              <tr>
                <td class="small">
                  @if(imageMap()[url]) {
                  <div
                    class="message-photo small"
                    [title]="imageMap()[url].title"
                    [libImageSource]="imageMap()[url].image"
                  ></div>
                  }
                </td>
                <td>
                  <input class="form-control form-control-sm" [value]="url" />
                </td>
              </tr>
              }
            </table>
            } @else {
            {{ request()?.message }}
            }
          </div>
        </div>
      </div>

      <div class="modal-footer">
        @if (request()?.type === 'prompt') {
        <input
          class="form-check-input"
          [(ngModel)]="multipleText"
          type="checkbox"
          value=""
          id="checkDefault"
        />
        <label class="form-check-label" for="checkDefault"> Multiple values </label>
        } @if(request()?.type !== 'alert') {
        <button
          type="button"
          class="btn btn-default"
          (click)="handleCancel()"
          data-bs-dismiss="modal"
        >
          Cancel
        </button>
        }
        <button
          type="button"
          class="btn btn-secondary"
          (click)="handleRespond()"
          data-bs-dismiss="modal"
        >
          Ok
        </button>
      </div>
    </div>
  </div>
</div>
