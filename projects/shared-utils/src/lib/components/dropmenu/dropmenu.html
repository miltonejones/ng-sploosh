<div class="dropdown">
  <button
    class="btn btn-sm dropdown-toggle"
    type="button"
    data-bs-toggle="dropdown"
    aria-expanded="false"
  >
    <i class="fa-solid fa-ellipsis-vertical"></i>
  </button>
  <ul class="dropdown-menu">
    @if(label()) {
    <li>
      <a class="dropdown-item fw-bold" href="javascript:void(0)">{{ label() }}</a>
    </li>
    <li class="mb-1"><hr class="dropdown-divider" /></li>
    } @for (item of items(); track item.key) {
    <li>
      @if (item.label) {
      <a (click)="clickItem(item.key)" class="dropdown-item" href="javascript:void(0)">
        @if (item.icon) {
        <i class="fa-solid {{ item.icon }}" [class.red]="item.red"></i>
        }
        {{ item.label }}
      </a>
      } @else {
      <hr class="dropdown-divider" />
      }
    </li>
    }
  </ul>
</div>
